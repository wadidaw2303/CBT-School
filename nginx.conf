# CBT School - Nginx Configuration
# Place this in /etc/nginx/sites-available/cbt-school and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name cbt-school.local;  # Change to your domain
    root /path/to/cbt-school/public;  # Change to your project path
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Prevent access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.(env|log|sql|md)$ {
        deny all;
    }

    # Disable directory listing
    autoindex off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|woff|woff2|ttf|svg|mp4|webm|mp3|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # Adjust for your PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # Handle exam WebSocket if needed (for real-time sync)
    # location /ws {
    #     proxy_pass http://localhost:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 86400;
    # }

    # Large file uploads
    client_max_body_size 20M;
    client_body_timeout 120s;

    # Error pages
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;

    # Additional security for exam routes
    location ~ ^/student/exam/ {
        # Ensure no caching for exam pages
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.php?$query_string;
    }
}

